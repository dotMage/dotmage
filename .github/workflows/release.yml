name: Release

# A release IS an annotated tag: the pipeline starts only from `git push origin vX.Y.Z`.
# Main stays green between tags and quietly collects features; the release commit is a
# CHANGELOG cut + version bump, nothing else (see dotmage-spec RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag, cross-checked against Cargo.toml
        id: check
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(grep '^version' dmage/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG" != "$CARGO" ]; then
            echo "::error::Tag v${TAG} does not match dmage/Cargo.toml version ${CARGO} — the release commit must bump the version and cut the CHANGELOG before tagging"
            exit 1
          fi
          # Annotated tags peel to a `^{}` entry on the remote; lightweight ones don't.
          # Checked against origin — the runner's local tag ref (post-checkout) is unreliable.
          if ! git ls-remote origin "refs/tags/v${TAG}*" | grep -qF '^{}'; then
            echo "::error::v${TAG} is a lightweight tag — releases use annotated tags: git tag -a v${TAG} -m 'v${TAG}'"
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: dmage-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: dmage-macos-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: dmage-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: dmage-linux-aarch64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: dmage-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked
      - name: Build
        run: ${{ matrix.use_cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}
      - name: Rename binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/dmage"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            src="${src}.exe"
          fi
          cp "$src" "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: sha256sum dmage-* > SHA256SUMS
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          # Section between "## [VERSION]" and the next "## [" heading
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG section for ${VERSION} — falling back to generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.version }}"
          # A version with a hyphen (v2.2.0-dev.1) is a dev-channel build:
          # marked prerelease, invisible to /releases/latest and to
          # `dmage upgrade` on the default stable channel.
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: |
            dmage-*
            SHA256SUMS
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}

  homebrew:
    needs: [version, release]
    # The formula tracks the stable channel only.
    if: ${{ !contains(needs.version.outputs.version, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          SHA_ARM=$(sha256sum dmage-macos-aarch64 | cut -d' ' -f1)
          SHA_X86=$(sha256sum dmage-macos-x86_64 | cut -d' ' -f1)
          SHA_LINUX=$(sha256sum dmage-linux-x86_64 | cut -d' ' -f1)

          cat > dotmage.rb << FORMULA
          class Dotmage < Formula
            desc "E2E-encrypted .env secret manager"
            homepage "https://github.com/dotMage/dotmage"
            version "${VERSION}"
            license "AGPL-3.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/dotMage/dotmage/releases/download/v#{version}/dmage-macos-aarch64"
                sha256 "${SHA_ARM}"
              else
                url "https://github.com/dotMage/dotmage/releases/download/v#{version}/dmage-macos-x86_64"
                sha256 "${SHA_X86}"
              end
            end

            on_linux do
              url "https://github.com/dotMage/dotmage/releases/download/v#{version}/dmage-linux-x86_64"
              sha256 "${SHA_LINUX}"
            end

            def install
              binary = Dir["dmage-*"].first || "dmage"
              bin.install binary => "dmage"
            end

            test do
              assert_match "dotMage", shell_output("#{bin}/dmage help")
            end
          end
          FORMULA

          # Push to homebrew tap (dotMage/homebrew-dotmage)
          git clone https://x-access-token:${GH_TOKEN}@github.com/dotMage/homebrew-dotmage.git tap
          cp dotmage.rb tap/Formula/dotmage.rb
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "dotmage ${VERSION}" || exit 0
          git push
