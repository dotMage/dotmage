[package]
name = "dmage"
version = "2.0.2"
edition = "2021"

[dependencies]
dotmage-client = { path = "../client" }
dotmage-crypto = { path = "../crypto" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
thiserror = "2"
rpassword = "7"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
# rustls, not native-tls: keeps Linux binaries free of a runtime libssl dependency
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
self-replace = "1"
